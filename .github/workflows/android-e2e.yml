# 뱃일 — 안드로이드 에뮬레이터에서 앱 기능 전체를 자동으로 눌러 본다 (5.15)
#
#   ★ 구글에 아무것도 올리지 않는다. 서명도 쓰지 않는다(디버그 빌드).
#   ★ tests/e2e_runner.js 를 이 검사용 빌드에만 끼워 넣는다. 스토어로 가는 빌드에는 안 들어간다.
#   아이폰 검사(ios-e2e.yml)와 같은 단계를 안드로이드에서 누른다 — 사장님 지시(2026-09-25):
#   「안드로이드와 아이폰에서 각각 … 잘 돌아가는지 확인까지 확실하게」
#   안드로이드 15(화면을 가장자리까지 그리는 판)에서 키보드가 칸을 가리는지도 본다.
#   결과: e2e-android-results 가지 (Claude 가 git 으로 받아 화면 사진을 본다)

name: 안드로이드 전체 기능 에뮬레이터 검사

on:
  workflow_dispatch:
    inputs:
      api:
        description: '안드로이드 판 (35=안드로이드 15 · 34=안드로이드 14)'
        type: choice
        options: ['35', '34']
        default: '35'

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: npm 설치
        run: npm ci || npm install

      - name: 파이어베이스 설정 파일 놓기
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -e
          printf '%s' "$GS" > /tmp/gs.raw
          if head -c 1 /tmp/gs.raw | grep -q '{'; then cp /tmp/gs.raw android/app/google-services.json
          else base64 --decode /tmp/gs.raw > android/app/google-services.json; fi

      - name: cap sync android
        run: npx cap sync android

      - name: 검사 파일 끼워 넣기 (이 빌드에만)
        run: |
          set -e
          P=android/app/src/main/assets/public
          cp tests/e2e_runner.js "$P/e2e.js"
          python3 - <<'PY2'
          p='android/app/src/main/assets/public/index.html'
          s=open(p,encoding='utf-8').read()
          tag='<script src="e2e.js"></script>'
          assert tag not in s
          i=s.rfind('</body>')
          s=s[:i]+tag+'\n'+s[i:]
          open(p,'w',encoding='utf-8').write(s)
          print('끼워 넣음')
          PY2

      - name: 디버그 APK 짓기
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/e2e.apk"

      - name: KVM 켜기 (에뮬레이터를 빠르게)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 에뮬레이터에서 전체 단계
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash tests/e2e_emu_run.sh "$RUNNER_TEMP/e2e.apk" "$RUNNER_TEMP/out/android-${{ inputs.api }}"

      - name: 결과를 e2e-android-results 가지에 올리기
        if: always()
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/out"; cd "$RUNNER_TEMP/out"
          for f in */logcat.txt; do [ -f "$f" ] && gzip -9 "$f"; done
          # ★ 옛 결과를 받아 온 다음 이번 결과를 그 위에 덮는다 (거꾸로 하면 옛것이 새것을 덮는다)
          rm -rf "$RUNNER_TEMP/new"; cp -r "$RUNNER_TEMP/out" "$RUNNER_TEMP/new"
          git init -q -b e2e-android-results
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add o "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch -q o e2e-android-results 2>/dev/null && git checkout -q o/e2e-android-results -- . 2>/dev/null || true
          cp -r "$RUNNER_TEMP/new/." .
          echo "android e2e run ${{ github.run_number }} · api ${{ inputs.api }} · ${{ github.sha }}" > RUN.txt
          git add -A && git commit -qm "android e2e ${{ github.run_number }}" && git push -qf o HEAD:e2e-android-results
