# 아이폰 앱이 만들어지는지만 본다 (서명 없이).
name: iOS build check

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: npm install
        run: npm ci || npm install

      - name: 파이어베이스 설정 파일 놓기 (없으면 컴파일만 보는 빈 틀)
        env:
          PLIST: ${{ secrets.GOOGLE_SERVICE_PLIST }}
        run: |
          # ★ 5.7 — 이 파일이 Xcode 프로젝트에 들어간 뒤로(빌드 19) 여기서 늘 「파일이 없다」 로 멈췄다.
          #   올리는 일감(ios-release)과 같은 비밀값을 쓰고, 비밀값이 없으면 컴파일만 되게 빈 틀을 둔다.
          F=ios/App/App/GoogleService-Info.plist
          if [ -n "$PLIST" ]; then
            printf '%s' "$PLIST" > /tmp/gs.raw
            if head -c 5 /tmp/gs.raw | grep -q '<?xml'; then cp /tmp/gs.raw "$F"; else base64 --decode -i /tmp/gs.raw -o "$F"; fi
          else
            printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0"><dict/></plist>\n' > "$F"
          fi
          plutil -lint "$F"

      - name: cap sync ios
        run: npx cap sync ios

      - name: pod install
        working-directory: ios/App
        run: |
          pod repo update --silent || true
          pod install

      - name: build (no signing)
        working-directory: ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: done
        run: echo "iOS app compiles on Apple machine."
