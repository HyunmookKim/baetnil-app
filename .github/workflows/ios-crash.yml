# 뱃일 — 아이폰에서 앱이 죽었을 때, 그 충돌보고서를 맥 없이 받아 읽는다.
#
#   App Store Connect 웹 화면은 충돌 내용을 안 보여 주고 「Xcode에서 열기」만 준다.
#   맥이 없으면 그걸로 끝이다. 그래서 애플의 API 로 직접 받아 온다.
#
#   쓰는 열쇠는 앱 올릴 때 쓰는 것과 같다 — 새로 만들 것이 없다.
#     비밀값        ASC_KEY_P8 · ASC_ISSUER_ID
#     저장소 변수   ASC_KEY_ID_PLAIN (키 ID 열 글자)
#
#   ★ 받은 보고서는 「crash-reports」 라는 꾸러미로 남는다. 내려받아서 읽으면 된다.
#   ★ 숫자 주소를 함수 이름으로 바꿔 읽으려면 같은 빌드의 dSYM 꾸러미가 있어야 한다.
#     그건 「iOS 앱 만들어 올리기」 가 빌드할 때마다 남겨 둔다.

name: 아이폰 충돌보고서 가져오기

on:
  workflow_dispatch:
    inputs:
      how_many:
        description: '최근 몇 건까지 가져올까요?'
        required: true
        default: '20'

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      APP_ID: '6811930420'

    steps:
      - name: 애플 열쇠 놓기
        env:
          S_P8: ${{ secrets.ASC_KEY_P8 }}
          S_ID: ${{ secrets.ASC_KEY_ID }}
          V_ID: ${{ vars.ASC_KEY_ID_PLAIN }}
        run: |
          set -e
          mkdir -p ~/private_keys
          clean () { tr -d '\r' < "$1" | sed $'1s/^\xEF\xBB\xBF//'; }
          printf '%s' "$S_P8" > /tmp/a.raw ; clean /tmp/a.raw > /tmp/a
          printf '%s' "$S_ID" > /tmp/b.raw ; clean /tmp/b.raw > /tmp/b

          KEY_ID=$(printf '%s' "$V_ID" | tr -d '[:space:]')
          printf '%s' "$KEY_ID" | grep -Eq '^[A-Z0-9]{10}$' \
            || { echo "::error::저장소 변수 ASC_KEY_ID_PLAIN 이 열 글자짜리 키 ID 가 아닙니다."; exit 1; }
          DEST=~/private_keys/AuthKey_${KEY_ID}.p8

          OK=0
          for CAND in /tmp/a /tmp/b; do
            BODY=$(sed -e 's/-----BEGIN PRIVATE KEY-----//g' -e 's/-----END PRIVATE KEY-----//g' "$CAND" | tr -d '[:space:]')
            [ ${#BODY} -gt 100 ] || continue
            { echo '-----BEGIN PRIVATE KEY-----'; printf '%s' "$BODY" | fold -w 64; echo; echo '-----END PRIVATE KEY-----'; } > /tmp/try.p8
            if openssl pkey -in /tmp/try.p8 -noout 2>/dev/null; then
              cp /tmp/try.p8 "$DEST"; chmod 600 "$DEST"; OK=1
              echo "열쇠를 찾았습니다."
              break
            fi
          done
          [ "$OK" = "1" ] || { echo "::error::어느 비밀값에서도 온전한 .p8 열쇠를 찾지 못했습니다."; exit 1; }
          echo "ASC_KEY_ID_OK=${KEY_ID}" >> "$GITHUB_ENV"
          echo "ASC_KEY_PATH=${DEST}"    >> "$GITHUB_ENV"

      - name: 충돌보고서 받아 오기
        env:
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          HOW_MANY: ${{ inputs.how_many }}
        run: |
          set -e
          mkdir -p crash-reports
          node --input-type=module <<'JS'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';

          const KEY   = fs.readFileSync(process.env.ASC_KEY_PATH, 'utf8');
          const KID   = process.env.ASC_KEY_ID_OK;
          const ISS   = (process.env.ISSUER || '').trim();
          const APP   = process.env.APP_ID;
          const LIMIT = Math.min(Math.max(parseInt(process.env.HOW_MANY || '20', 10) || 20, 1), 50);
          const OUT   = 'crash-reports';

          const b64u = (b) => Buffer.from(b).toString('base64')
            .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');

          const token = (() => {
            const now = Math.floor(Date.now()/1000);
            const head = b64u(JSON.stringify({ alg:'ES256', kid:KID, typ:'JWT' }));
            const body = b64u(JSON.stringify({ iss:ISS, iat:now, exp:now+1200, aud:'appstoreconnect-v1' }));
            const sig  = crypto.createSign('SHA256')
              .update(head+'.'+body)
              .sign({ key:KEY, dsaEncoding:'ieee-p1363' });
            return head+'.'+body+'.'+b64u(sig);
          })();

          const api = async (url) => {
            const full = url.startsWith('http') ? url : 'https://api.appstoreconnect.apple.com'+url;
            const r = await fetch(full, { headers:{ Authorization:'Bearer '+token } });
            const t = await r.text();
            let j = null; try { j = JSON.parse(t); } catch(_) {}
            return { ok:r.ok, status:r.status, json:j, text:t };
          };

          // ── ① 충돌 목록
          let list = await api(`/v1/apps/${APP}/betaFeedbackCrashSubmissions?limit=${LIMIT}&sort=-createdDate`);
          if (!list.ok) {
            console.log(`정렬을 붙인 요청이 ${list.status} 로 거절당해서, 정렬 없이 다시 물어봅니다.`);
            list = await api(`/v1/apps/${APP}/betaFeedbackCrashSubmissions?limit=${LIMIT}`);
          }
          if (!list.ok) {
            console.log('::error::애플이 충돌 목록을 주지 않았습니다. ' + list.status);
            console.log(list.text.slice(0, 1200));
            process.exit(1);
          }
          const rows = (list.json && list.json.data) || [];
          fs.writeFileSync(path.join(OUT,'00-목록.json'), JSON.stringify(list.json, null, 2));
          console.log(`충돌 ${rows.length}건을 찾았습니다.`);
          if (!rows.length) {
            fs.writeFileSync(path.join(OUT,'00-읽을거리.txt'), '애플에 올라온 충돌보고서가 없습니다.\n');
            process.exit(0);
          }

          // ── ② 한 건씩 알맹이 받기
          const 요약 = [];
          for (let i = 0; i < rows.length; i++) {
            const it = rows[i];
            const a  = it.attributes || {};
            const 번호 = String(i+1).padStart(2,'0');
            const 때  = (a.createdDate || '').replace(/[:]/g,'-');
            const 이름 = `${번호}-${때 || it.id}`;

            const 머리 = [
              `충돌 ${번호}`,
              `언제      ${a.createdDate || '?'}`,
              `기기      ${a.deviceModel || '?'} · ${a.osVersion || '?'}`,
              `앱 판     ${a.appPlatform || ''} ${a.appUpTime !== undefined ? '(켠 지 '+a.appUpTime+'초 만에)' : ''}`,
              `배터리    ${a.batteryPercentage !== undefined ? a.batteryPercentage+'%' : '?'}`,
              `남은 공간 ${a.diskBytesAvailable !== undefined ? Math.round(a.diskBytesAvailable/1048576)+'MB' : '?'}`,
              `id        ${it.id}`,
              ''
            ].join('\n');

            const log = await api(`/v1/betaFeedbackCrashSubmissions/${it.id}/crashLog`);
            let 알맹이 = '';
            if (!log.ok) {
              알맹이 = `(애플이 이 건의 기록을 주지 않았습니다 — ${log.status})\n${log.text.slice(0,800)}`;
            } else {
              fs.writeFileSync(path.join(OUT, 이름 + '.json'), JSON.stringify(log.json, null, 2));
              const la = (log.json && log.json.data && log.json.data.attributes) || {};
              // 애플은 logText 라는 칸에 글을 통째로 준다 (2026-09-20 확인). 주소로 줄 때도 대비해 둔다.
              const 글 = la.logText || la.crashLog || la.log || la.text || la.content || '';
              const 주소 = la.url || la.downloadUrl || la.crashLogUrl || '';
              if (글) {
                알맹이 = String(글);
              } else if (주소) {
                const r = await fetch(주소);
                알맹이 = r.ok ? await r.text() : `(내려받기 실패 ${r.status}) ${주소}`;
              } else {
                알맹이 = '(글도 주소도 없습니다. 같은 이름의 .json 을 열어 보십시오.)\n'
                       + JSON.stringify(la, null, 2).slice(0, 2000);
              }
            }
            fs.writeFileSync(path.join(OUT, 이름 + '.txt'), 머리 + 알맹이 + '\n');

            // 어느 줄에서 죽었는지 한 줄 요약
            const 줄들 = String(알맹이).split('\n');
            const 첫줄 = 줄들.find(l => /Exception Type|Termination|Thread 0 Crashed|reason:/i.test(l)) || '';
            요약.push(`${번호}  ${a.createdDate || '?'}  ${a.deviceModel || '?'}/${a.osVersion || '?'}  ${첫줄.trim().slice(0,120)}`);

            // ★ 꾸러미를 안 열고도 여기서 바로 읽히게, 중요한 대목을 찍어 둔다.
            const 중요 = 줄들.filter(l => /Exception Type|Exception Subtype|Termination Reason|Termination Description|abort\(\)|Application Specific Information|\*\*\* Terminating|reason:|Triggered by Thread/i.test(l));
            const 시작 = 줄들.findIndex(l => /^Thread \d+ Crashed/.test(l));
            console.log(`\n──── ${이름} ────`);
            중요.slice(0, 12).forEach(l => console.log('   ' + l.trim().slice(0, 220)));
            if (시작 >= 0) {
              console.log('   ── 죽은 갈래의 맨 위 12줄 ──');
              줄들.slice(시작, 시작 + 13).forEach(l => console.log('   ' + l.slice(0, 220)));
            }
          }

          fs.writeFileSync(path.join(OUT,'00-읽을거리.txt'),
            '뱃일 — 아이폰 충돌보고서\n' +
            '받은 때: ' + new Date().toISOString() + '\n\n' +
            요약.join('\n') + '\n\n' +
            '각 건의 자세한 내용은 같은 꾸러미 안의 번호별 .txt 에 있습니다.\n');
          console.log('\n' + 요약.join('\n'));
          JS

      - name: 받은 것 꾸러미로 남기기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crash-reports
          path: crash-reports
          if-no-files-found: warn
          retention-days: 30

      - name: 열쇠 지우기
        if: always()
        run: rm -rf ~/private_keys /tmp/a /tmp/b /tmp/a.raw /tmp/b.raw /tmp/try.p8
