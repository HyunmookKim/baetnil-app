# 뱃일 — 아이폰 시뮬레이터에서 효율을 잰다 (재기만 한다. 앱을 고치지 않는다)
#
#   ★ 애플에 아무것도 올리지 않는다.
#   ★ tests/perf_probe.js 를 시뮬레이터용 빌드에만 끼워 넣는다. 애플로 가는 빌드에는 안 들어간다.
#   ★ 시뮬레이터는 맥의 CPU 로 돈다 — **절대 시간은 실제 아이폰과 다르다.**
#     여기서 보는 것은 아이폰 엔진(JavaScriptCore)이 「어떻게 동작하는가」 다:
#     두 번째 켤 때 빨라지는가 · 폰 저장소 한도 · 항적이 길어지면 몇 배 느려지는가.
#   결과: perf-results 가지 (ios/…)

name: 아이폰 효율 재기

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  perf:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      BUNDLE_ID: kr.baetnil.app
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: npm 설치
        run: npm ci || npm install

      - name: 파이어베이스 설정 파일 놓기
        env:
          PLIST: ${{ secrets.GOOGLE_SERVICE_PLIST }}
        run: |
          set -e
          printf '%s' "$PLIST" > /tmp/gs.raw
          if head -c 5 /tmp/gs.raw | grep -q '<?xml'; then cp /tmp/gs.raw ios/App/App/GoogleService-Info.plist
          else base64 --decode -i /tmp/gs.raw -o ios/App/App/GoogleService-Info.plist; fi
          plutil -lint ios/App/App/GoogleService-Info.plist

      - name: cap sync ios
        run: npx cap sync ios

      - name: ★ 아이폰 설정 맞추기 (권한 안내문 네 나라 말 · 구글 로그인 주소)
        run: bash ios/App/prepare_ios.sh

      - name: pod install
        working-directory: ios/App
        run: |
          pod repo update --silent || true
          pod install
          grep -q "GoogleSignIn" Podfile.lock || { echo "::error::구글 로그인 부품(GoogleSignIn)이 안 들어갔습니다."; exit 1; }

      - name: 재기 파일 끼워 넣기 (시뮬레이터용에만)
        run: |
          set -e
          P=ios/App/App/public
          cp tests/perf_probe.js "$P/perf.js"
          python3 - <<'PY2'
          p='ios/App/App/public/index.html'
          s=open(p,encoding='utf-8').read()
          tag='<script src="perf.js"></script>'
          assert tag not in s
          i=s.rfind('</body>')
          s=s[:i]+tag+'\n'+s[i:]
          open(p,'w',encoding='utf-8').write(s)
          print('끼워 넣음')
          PY2

      - name: 시뮬레이터용 빌드
        working-directory: ios/App
        run: |
          set -e -o pipefail
          xcodebuild build -workspace App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/sim" CODE_SIGNING_ALLOWED=NO | tail -20
          APP="$RUNNER_TEMP/sim/Build/Products/Debug-iphonesimulator/App.app"
          test -f "$APP/public/perf.js"
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: 큰 아이폰
        run: bash tests/perf_sim_run.sh "iPhone 17 Pro Max|iPhone 16 Pro Max|iPhone 16 Plus|iPhone Pro" "$RUNNER_TEMP/out/ios-큰아이폰"

      - name: 작은 아이폰
        if: always()
        run: bash tests/perf_sim_run.sh "iPhone SE|iPhone 16e|iPhone 17" "$RUNNER_TEMP/out/ios-작은아이폰"

      - name: 결과를 perf-results 가지에 올리기
        if: always()
        run: |
          set -e
          cd "$RUNNER_TEMP/out"
          git init -q -b perf-results
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add o "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch -q o perf-results 2>/dev/null && git checkout -q o/perf-results -- . 2>/dev/null || true
          echo "ios run ${{ github.run_number }} · ${{ github.sha }}" > RUN-ios.txt
          git add -A && git commit -qm "ios perf ${{ github.run_number }}" && git push -qf o HEAD:perf-results
