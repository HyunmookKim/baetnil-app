# 뱃일 — 아이폰 앱을 만들어 App Store Connect(테스트플라이트)로 올린다.
#
#   맥이 없으므로 깃허브의 맥 기계를 빌려 쓴다.
#   기기를 하나도 등록하지 않았으므로 「개발용」 프로파일은 만들 수 없다.
#   그래서 처음부터 배포용(App Store) 인증서와 프로파일을 애플에 만들어 받아서 쓴다.
#
#   비밀값        ASC_KEY_P8 · ASC_ISSUER_ID · APPLE_TEAM_ID · GOOGLE_SERVICE_PLIST
#   저장소 변수   ASC_KEY_ID_PLAIN (키 ID 열 글자)
#
#   ★ 빌드 번호는 올릴 때마다 커져야 한다. 같은 번호를 두 번 올리면 조용히 거부당한다.

name: iOS 앱 만들어 올리기

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: '앱 판 번호 (예 4.138)'
        required: true
        default: '4.138'
      upload:
        description: '애플에 올릴까요? (아니요 = 만들어지는지만 확인)'
        type: boolean
        default: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      BUNDLE_ID: kr.baetnil.app

    steps:
      - name: 소스 받기
        uses: actions/checkout@v4

      - name: Xcode 고르기
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: node 준비
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: npm 설치
        run: npm ci || npm install

      - name: ★ 앱 판 번호 확인 (4.131 사고를 되풀이하지 않는 자리)
        run: |
          set -e
          F=www/index.html
          [ -f "$F" ] || { echo "::error::www/index.html 이 없습니다."; exit 1; }
          VER=$(grep -o "const APP_VER = '[^']*'" "$F" | head -1 | sed "s/.*'\(.*\)'/\1/")
          [ -n "$VER" ] || { echo "::error::www/index.html 에서 APP_VER 를 못 찾았습니다."; exit 1; }
          WANT='${{ inputs.marketing_version }}'
          echo "깃허브 www 속 앱 판 번호: $VER · 넣으신 판 번호: $WANT"
          echo "## 뱃일 $VER (빌드 ${{ github.run_number }})" >> "$GITHUB_STEP_SUMMARY"
          if [ "$VER" != "$WANT" ]; then
            echo "::error::www 속은 $VER 인데 $WANT 로 내려 하십니다. 겉 번호만 새것이고 속은 옛것이 됩니다."
            exit 1
          fi

      - name: 파이어베이스 설정 파일 놓기
        env:
          PLIST: ${{ secrets.GOOGLE_SERVICE_PLIST }}
        run: |
          set -e
          printf '%s' "$PLIST" > /tmp/gs.raw
          if head -c 5 /tmp/gs.raw | grep -q '<?xml'; then
            cp /tmp/gs.raw ios/App/App/GoogleService-Info.plist
          else
            base64 --decode -i /tmp/gs.raw -o ios/App/App/GoogleService-Info.plist
          fi
          plutil -lint ios/App/App/GoogleService-Info.plist

      - name: cap sync ios
        run: npx cap sync ios

      - name: ★ 아이폰 설정 맞추기 (권한 안내문 네 나라 말 · 구글 로그인 주소 · 로그인 부품 확인)
        run: bash ios/App/prepare_ios.sh

      - name: pod install
        working-directory: ios/App
        run: |
          pod repo update --silent || true
          pod install
          # ★ 6.0 — 구글 로그인 부품이 빠진 채(Lite) 나가면 아이폰 구글 로그인이 대답 없이 멈춘다
          grep -q "GoogleSignIn" Podfile.lock || { echo "::error::구글 로그인 부품(GoogleSignIn)이 안 들어갔습니다."; exit 1; }

      - name: ★ 검사 파일이 섞이지 않았는가
        run: |
          if [ -f ios/App/App/public/e2e.js ] || grep -q 'e2e.js' ios/App/App/public/index.html; then
            echo "::error::시뮬레이터 검사 파일(e2e.js)이 스토어용 빌드에 들어 있습니다."; exit 1; fi

      - name: ★ 시뮬레이터에서 켜 보기 — 오류가 나면 애플에 안 올린다
        working-directory: ios/App
        run: |
          set -e -o pipefail
          # ★ 5.7 — 아이폰이 없어 빌드를 올리기 전에 한 번도 켜 보지 못했다.
          #   애플이 만든 아이폰 시뮬레이터에서 실제로 켜고, 앱이 남기는 자국을 읽는다.
          #   [baetnil-boot] 붙었습니다  ← 이것이 나와야 하고
          #   [baetnil-err] · Script error ← 이것이 하나라도 나오면 멈춘다.
          xcodebuild build \
            -workspace App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/sim" CODE_SIGNING_ALLOWED=NO | tail -25
          APP="$RUNNER_TEMP/sim/Build/Products/Debug-iphonesimulator/App.app"
          [ -d "$APP" ] || { echo "::error::시뮬레이터용 앱이 안 만들어졌습니다."; exit 1; }
          DEV=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[x['udid'] for k,v in sorted(d.items()) if 'iOS' in k for x in v if x['name'].startswith('iPhone')]; print(c[-1])")
          echo "시뮬레이터: $DEV"
          xcrun simctl boot "$DEV" || true
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" "$APP"
          mkdir -p "$RUNNER_TEMP/simshot"
          LOG="$RUNNER_TEMP/sim.log"; : > "$LOG"
          OSLOG="$RUNNER_TEMP/simshot/oslog.txt"
          # ★ 앱의 console.log 는 캐퍼시터가 표준 출력으로 찍는다. 파일로 받으면 버퍼에 갇혀
          #   안 나오므로(빌드 22 에서 겪음) NSUnbufferedIO 를 켜고, 시스템 기록도 함께 받는다.
          xcrun simctl spawn "$DEV" log stream --style compact --level debug \
            --predicate 'process == "App"' > "$OSLOG" 2>&1 &
          LOGPID=$!
          SIMCTL_CHILD_NSUnbufferedIO=YES \
            xcrun simctl launch --terminate-running-process --stdout="$LOG" --stderr="$LOG" "$DEV" "$BUNDLE_ID"
          sleep 50
          xcrun simctl io "$DEV" screenshot "$RUNNER_TEMP/simshot/1-first.png"
          kill $LOGPID 2>/dev/null || true
          cat "$OSLOG" >> "$LOG"
          cp "$LOG" "$RUNNER_TEMP/simshot/app-log.txt"
          echo "----- 앱이 남긴 자국 -----"; grep -a "baetnil-\|Script error\|\[error\]\|⚡️" "$LOG" | head -120 || true
          echo "----- 표준 출력 끝부분 -----"; head -c 20000 "$LOG" | tail -40 || true
          FAIL=0
          grep -aq "\[baetnil-boot\] 붙었습니다" "$LOG" || { echo "::error::앱이 파이어베이스에 붙는 데까지 가지 못했습니다."; FAIL=1; }
          if grep -aE "\[baetnil-err\]|Script error" "$LOG"; then echo "::error::시뮬레이터에서 오류가 났습니다. 올리지 않습니다."; FAIL=1; fi
          echo "## 시뮬레이터 확인: $([ $FAIL = 0 ] && echo 통과 || echo 실패)" >> "$GITHUB_STEP_SUMMARY"
          xcrun simctl shutdown "$DEV" || true
          exit $FAIL

      - name: 시뮬레이터 화면·자국 남겨 두기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-${{ inputs.marketing_version }}-${{ github.run_number }}
          path: ${{ runner.temp }}/simshot
          if-no-files-found: ignore
          retention-days: 30

      - name: 인증서 보관함 (한 번 만든 배포 인증서를 다시 쓴다)
        uses: actions/cache@v4
        with:
          path: certs
          key: ios-dist-cert-v1

      - name: 애플 열쇠 놓기
        env:
          S_P8: ${{ secrets.ASC_KEY_P8 }}
          S_ID: ${{ secrets.ASC_KEY_ID }}
          V_ID: ${{ vars.ASC_KEY_ID_PLAIN }}
        run: |
          set -e
          mkdir -p ~/private_keys
          clean () { tr -d '\r' < "$1" | sed $'1s/^\xEF\xBB\xBF//'; }
          printf '%s' "$S_P8" > /tmp/a.raw ; clean /tmp/a.raw > /tmp/a
          printf '%s' "$S_ID" > /tmp/b.raw ; clean /tmp/b.raw > /tmp/b

          KEY_ID=$(printf '%s' "$V_ID" | tr -d '[:space:]')
          printf '%s' "$KEY_ID" | grep -Eq '^[A-Z0-9]{10}$' \
            || { echo "::error::저장소 변수 ASC_KEY_ID_PLAIN 이 열 글자짜리 키 ID 가 아닙니다."; exit 1; }
          DEST=~/private_keys/AuthKey_${KEY_ID}.p8

          # 두 비밀값 중 실제로 열리는 열쇠를 골라 쓴다 (칸이 뒤바뀌어 있어도 된다)
          OK=0
          for CAND in /tmp/a /tmp/b; do
            BODY=$(sed -e 's/-----BEGIN PRIVATE KEY-----//g' -e 's/-----END PRIVATE KEY-----//g' "$CAND" | tr -d '[:space:]')
            [ ${#BODY} -gt 100 ] || continue
            { echo '-----BEGIN PRIVATE KEY-----'; printf '%s' "$BODY" | fold -w 64; echo; echo '-----END PRIVATE KEY-----'; } > /tmp/try.p8
            if openssl pkey -in /tmp/try.p8 -noout 2>/dev/null; then
              cp /tmp/try.p8 "$DEST"; chmod 600 "$DEST"; OK=1
              echo "열쇠를 찾았습니다 ($([ "$CAND" = /tmp/a ] && echo ASC_KEY_P8 || echo ASC_KEY_ID) 쪽)"
              break
            fi
          done
          if [ "$OK" != "1" ]; then
            echo "::error::어느 비밀값에서도 온전한 .p8 열쇠를 찾지 못했습니다."
            for C in /tmp/a /tmp/b; do
              B=$(sed -e 's/-----BEGIN PRIVATE KEY-----//g' -e 's/-----END PRIVATE KEY-----//g' "$C" | tr -d '[:space:]')
              echo "$C : $(wc -c < "$C" | tr -d ' ') 바이트 · 알맹이 ${#B} 글자 (정상은 184 안팎)"
            done
            exit 1
          fi
          echo "ASC_KEY_ID_OK=${KEY_ID}" >> "$GITHUB_ENV"
          echo "ASC_KEY_PATH=${DEST}"    >> "$GITHUB_ENV"

      - name: 배포용 인증서·프로파일 받아 오기
        env:
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_HIDE_CHANGELOG: '1'
          FASTLANE_DISABLE_COLORS: '1'
        run: |
          set -e
          ruby -rjson -e 'puts JSON.pretty_generate({"key_id"=>ENV["ASC_KEY_ID_OK"],"issuer_id"=>ENV["ISSUER"],"key"=>File.read(ENV["ASC_KEY_PATH"]),"in_house"=>false})' > /tmp/asc_key.json

          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p ci "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KC"
          echo "KEYCHAIN=$KC" >> "$GITHUB_ENV"

          mkdir -p certs "$RUNNER_TEMP/profiles"
          fastlane run cert \
            development:false \
            api_key_path:/tmp/asc_key.json \
            team_id:"$TEAM" \
            keychain_path:"$KC" \
            keychain_password:ci \
            output_path:certs

          fastlane run sigh \
            development:false \
            app_identifier:"$BUNDLE_ID" \
            api_key_path:/tmp/asc_key.json \
            team_id:"$TEAM" \
            output_path:"$RUNNER_TEMP/profiles" \
            filename:baetnil.mobileprovision

          PP="$RUNNER_TEMP/profiles/baetnil.mobileprovision"
          NAME=$(security cms -D -i "$PP" | plutil -extract Name raw -)
          UUID=$(security cms -D -i "$PP" | plutil -extract UUID raw -)
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "프로파일 준비 완료 · $NAME"

      - name: App 타겟 서명 설정 (팟에는 손대지 않는다)
        working-directory: ios/App
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -e
          ruby - <<'RUBY'
          require 'xcodeproj'
          proj = Xcodeproj::Project.open('App.xcodeproj')
          app  = proj.targets.find { |t| t.name == 'App' }
          raise 'App 타겟을 못 찾음' unless app
          app.build_configurations.each do |c|
            c.build_settings['CODE_SIGN_ENTITLEMENTS']    = 'App/App.entitlements'
            c.build_settings['PRODUCT_BUNDLE_IDENTIFIER'] = ENV['BUNDLE_ID']
            c.build_settings['DEVELOPMENT_TEAM']          = ENV['TEAM']
            c.build_settings['CODE_SIGN_STYLE']           = 'Manual'
            c.build_settings['CODE_SIGN_IDENTITY']        = 'Apple Distribution'
            c.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ENV['PROFILE_NAME']
          end
          proj.save
          puts "App 타겟 서명 설정 완료 · #{ENV['PROFILE_NAME']}"
          RUBY

      - name: 보관본 만들기 (archive)
        working-directory: ios/App
        run: |
          security unlock-keychain -p ci "$KEYCHAIN"
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            MARKETING_VERSION='${{ inputs.marketing_version }}' \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: ★ 앱 알맹이에 GoogleService-Info.plist 가 들어갔는지 확인
        run: |
          set -e
          # ★ 2026-09-20 — 이 확인이 없어서 아이폰에서 켜자마자 죽었다(빌드 18).
          #   파일을 ios/App/App/ 에 써 두기만 하고 Xcode 프로젝트에 넣지 않으면
          #   앱 알맹이에는 안 들어간다. 그러면 파이어베이스가 시작하다 앱을 죽인다.
          #   ★ 반드시 「올리기」 앞에서 본다. 애플로 바로 올리는 방식일 때는
          #     ipa 파일이 남지 않으므로, 보관본(.xcarchive) 안의 앱을 본다.
          APP=$(ls -d "$RUNNER_TEMP/App.xcarchive/Products/Applications"/*.app | head -1)
          echo "앱 알맹이: $APP"
          if [ ! -f "$APP/GoogleService-Info.plist" ]; then
            echo "::error::앱 알맹이에 GoogleService-Info.plist 가 없습니다. 이대로 내면 아이폰에서 켜자마자 죽습니다."
            ls -la "$APP" | head -40
            exit 1
          fi
          plutil -lint "$APP/GoogleService-Info.plist"
          echo "GoogleService-Info.plist 들어 있습니다."
          # ★ 6.0 — 애플 로그인·알림 권한이 서명에 실제로 들어갔는지 본다 (없으면 애플 로그인이 error 1000 으로 끝난다)
          codesign -d --entitlements - "$APP" > /tmp/ent.txt 2>&1 || true
          cat /tmp/ent.txt | head -40
          grep -q "com.apple.developer.applesignin" /tmp/ent.txt || { echo "::error::서명에 애플 로그인 권한(applesignin)이 없습니다."; exit 1; }
          grep -q "aps-environment" /tmp/ent.txt || { echo "::error::서명에 알림 권한(aps-environment)이 없습니다."; exit 1; }
          echo "애플 로그인·알림 권한이 서명에 들어 있습니다."

      - name: 내보내기 설정 만들기
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DEST=$( [ "${{ inputs.upload }}" = "true" ] && echo upload || echo export )
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM}</string>
            <key>destination</key><string>${DEST}</string>
            <key>uploadSymbols</key><true/>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string></dict>
            <key>generateAppStoreInformation</key><true/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"

      - name: 내보내기 · 애플로 올리기
        env:
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          security unlock-keychain -p ci "$KEYCHAIN"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/out" \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID_OK" \
            -authenticationKeyIssuerID "$ISSUER"

      - name: 해독표(dSYM) 남겨 두기 — 충돌보고서를 사람 말로 읽기 위한 것
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dSYMs-${{ inputs.marketing_version }}-${{ github.run_number }}
          path: ${{ runner.temp }}/App.xcarchive/dSYMs
          if-no-files-found: warn
          retention-days: 90

      - name: 만든 파일 남겨 두기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-out
          path: ${{ runner.temp }}/out
          if-no-files-found: ignore
          retention-days: 7

      - name: 열쇠 지우기
        if: always()
        run: |
          rm -rf ~/private_keys /tmp/asc_key.json
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
