ext {
    // ★★ 2026-08-31 부터 구글 플레이는 새 앱과 앱 업데이트에 targetSdk 36(안드로이드 16)
    //   이상을 요구한다. 35 로 두면 **올리는 것 자체가 막힌다** (심사 이전 문제다).
    //   support.google.com/googleplay/android-developer/answer/11926878
    //   ★ compileSdk 36 은 안드로이드 빌드도구(AGP) 8.9 이상이라야 안다 — 아래 build.gradle 도 같이 올렸다.
    minSdkVersion = 23
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.9.2'
    androidxAppCompatVersion = '1.7.0'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.15.0'
    androidxFragmentVersion = '1.8.4'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.12.1'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.2.1'
    androidxEspressoCoreVersion = '3.6.1'
    cordovaAndroidVersion = '10.1.1'
    // ★ 구글 로그인 부품을 같이 넣는다.
    //   이걸 안 켜면 @capacitor-firebase/authentication 이 붙어도 구글은 안 된다.
    rgcfaIncludeGoogle = true
}